name: Marketplace identity

# One-off helper for setting up Marketplace publishing without a token (docs/RELEASING.md): signs in as the
# managed identity in Microsoft Entra ID and prints the id to add as a member of the publisher. The Marketplace
# knows an identity by its Azure DevOps profile id, which is not the Entra object id and can only be read while
# signed in as that identity - in the same environment the release publishes from.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  identity:
    runs-on: ubuntu-latest
    environment: marketplace
    steps:
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Marketplace profile id
        run: |
          id=$(az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 --query id -o tsv)
          echo "::notice::Add $id as a Contributor on the Members page of the publisher netforms: https://marketplace.visualstudio.com/manage/publishers/netforms"
