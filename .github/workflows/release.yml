name: Release

# Builds every package and publishes it: the NuGet packages to nuget.org, the VS Code extension to the
# Marketplace and Open VSX, and a GitHub release (which creates the tag v<Version>).
#
# How it starts (docs/RELEASING.md):
#   - from CI (workflow_call): a push to main whose <Version> in Directory.Build.props has no tag yet,
#     after the tests passed - bumping the version is the release;
#   - a tag v<Version> pushed by hand;
#   - by hand (workflow_dispatch): a dry run that only builds the packages, or a real one with "publish".

on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: true
      tested:
        description: The caller already ran the tests on this commit.
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to nuget.org, the Marketplace and GitHub (otherwise a dry run that only builds the packages)
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

env:
  PUBLISH: ${{ inputs.publish || startsWith(github.ref, 'refs/tags/v') }}

jobs:
  nuget:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Version
        id: version
        run: |
          version=$(dotnet msbuild src/NetForms/NetForms.csproj -getProperty:Version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME, but Directory.Build.props says $version"; exit 1
          fi

      - run: dotnet build NetForms.slnx -c Release
      - if: ${{ !inputs.tested }}
        run: dotnet test NetForms.slnx --no-build -c Release
      - run: dotnet pack NetForms.slnx --no-build -c Release -o artifacts/pkg
      - run: dotnet pack templates/NetForms.Templates.csproj -c Release -o artifacts/pkg
      - uses: actions/upload-artifact@v7
        with:
          name: nuget
          path: artifacts/pkg/

      # Trusted publishing (no stored key): a policy on nuget.org for this repository and release.yml, and
      # the repository variable NUGET_USER. The secret NUGET_API_KEY is the fallback: used when there is no
      # policy, when the exchange fails, or when nuget.org refuses the temporary key.
      - name: NuGet login (trusted publishing)
        id: nuget-login
        if: env.PUBLISH == 'true' && vars.NUGET_USER != ''
        continue-on-error: true
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      # The .snupkg symbol packages go with their .nupkg; --skip-duplicate makes a retry safe.
      - name: Push to nuget.org
        if: env.PUBLISH == 'true'
        env:
          TRUSTED_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          SECRET_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          push() { dotnet nuget push "artifacts/pkg/*.nupkg" --api-key "$1" --source https://api.nuget.org/v3/index.json --skip-duplicate; }
          if [ -n "$TRUSTED_KEY" ]; then
            if push "$TRUSTED_KEY"; then exit 0; fi
            echo "::warning::nuget.org refused the trusted-publishing key. The policy needs the scope 'Push new packages and package versions' and a glob matching NetForms* (docs/RELEASING.md)."
          fi
          if [ -n "$SECRET_KEY" ]; then push "$SECRET_KEY"; exit $?; fi
          echo "::error::Nothing could publish: fix the trusted-publishing policy on nuget.org or add the secret NUGET_API_KEY (docs/RELEASING.md)."
          exit 1

  vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: designer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: dotnet build ../tools/NetFormsDesigner.Host -c Release
      - if: ${{ !inputs.tested }}
        run: npm test
      # One .vsix per platform (only that platform's SkiaSharp natives), plus the universal one. A NetForms
      # preview (a version with a dash) goes out as a Marketplace pre-release.
      - name: Package
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' ../Directory.Build.props | head -1)
          if [[ "$version" == *-* ]]; then npm run package:targets -- --pre-release; else npm run package:targets; fi
          npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: vscode
          path: designer/*.vsix

  # One extension id, one package per platform: VS Code downloads the one for the machine it runs on. Only
  # the platform packages go to the Marketplace and Open VSX; the universal netforms-designer-<version>.vsix
  # (built without --pre-release, every platform's natives) is for installing by hand from GitHub Releases.
  #
  # Marketplace sign-in, whichever is set up (docs/RELEASING.md): a managed identity in Microsoft Entra ID
  # reached through GitHub OIDC (secrets AZURE_CLIENT_ID, AZURE_TENANT_ID; its federated credential names the
  # environment "marketplace", which is why this job runs in it), or the Azure DevOps token VSCE_PAT (global
  # tokens stop working on 2026-12-01). Neither: the step warns and the rest of the release goes on.
  vscode-publish:
    if: inputs.publish || startsWith(github.ref, 'refs/tags/v')
    needs: vscode
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    defaults:
      run:
        working-directory: designer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: vscode
          path: designer/dist

      - name: Sign in to Microsoft Entra ID
        if: env.AZURE_CLIENT_ID != ''
        continue-on-error: true
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # The identity first; VSCE_PAT (which vsce reads itself) when there is none or the Marketplace refuses it.
      - name: Publish to the VS Code Marketplace
        run: |
          publish() { for f in dist/netforms-designer-{win32,linux,darwin}-*.vsix; do npx vsce publish --packagePath "$f" --skip-duplicate "$@" || return 1; done; }
          if [ -n "$AZURE_CLIENT_ID" ]; then
            if publish --azure-credential; then exit 0; fi
            echo "::warning::The Marketplace refused the Entra ID identity: it must be a member of the publisher netforms (docs/RELEASING.md)."
          fi
          if [ -n "$VSCE_PAT" ]; then publish; exit $?; fi
          if [ -n "$AZURE_CLIENT_ID" ]; then exit 1; fi
          echo "::warning::Neither AZURE_CLIENT_ID nor VSCE_PAT: the extension is not published to the Marketplace (docs/RELEASING.md)."

      - name: Publish to Open VSX
        run: |
          if [ -z "$OVSX_PAT" ]; then echo "No OVSX_PAT secret: Open VSX skipped."; exit 0; fi
          for f in dist/netforms-designer-{win32,linux,darwin}-*.vsix; do npx --yes ovsx publish "$f" -p "$OVSX_PAT" --skip-duplicate; done

  github-release:
    if: inputs.publish || startsWith(github.ref, 'refs/tags/v')
    needs: [nuget, vscode, vscode-publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
      - name: Create the release (and the tag)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.nuget.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then echo "v$VERSION is already released."; exit 0; fi
          gh release create "v$VERSION" dist/nuget/* dist/vscode/* --target "$GITHUB_SHA" \
            --title "NetForms $VERSION" --notes-file CHANGELOG.md \
            $([[ "$VERSION" == *-* ]] && echo --prerelease)
